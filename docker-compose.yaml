version: "3.9"

services:
  db:
    image: postgres:15
    container_name: strikedoc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: strikedoc
      POSTGRES_PASSWORD: strikedocpass
      POSTGRES_DB: strikedoc_db
    ports:
      - "5433:5432"
    volumes:
      - strikedoc_pgdata:/var/lib/postgresql/data

volumes:
  strikedoc_pgdata:
