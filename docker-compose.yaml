version: "3.9"

services:
  db:
    image: postgres:15
    container_name: strikedoc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - strikedoc_pgdata:/var/lib/postgresql/data

volumes:
  strikedoc_pgdata:
